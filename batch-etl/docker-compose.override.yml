services:
  spark-master:
    volumes:
      # Mount riêng thư mục batch ETL
      - ./batch-etl:/opt/spark/work-dir/batch-etl

      # Mount JDBC driver
      - ./batch-etl/jars/postgresql-42.7.1.jar:/opt/spark/jars/postgresql-42.7.1.jar

    environment:
      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tlcn
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl123

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SSL: "false"

      BRONZE_BUCKET: bronze
      SILVER_BUCKET: silver

      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

  spark-worker:
    volumes:
      - ./batch-etl:/opt/spark/work-dir/batch-etl
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
