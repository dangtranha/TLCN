services:
  # 1. Database Source (Postgres)
  postgres:
    image: postgres:13
    container_name: postgres_source
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_db  # Đặt tên DB cụ thể
    ports:
      - "5432:5432"
    volumes:
      # Lưu dữ liệu DB để không bị mất khi restart
      - postgres_data:/var/lib/postgresql/data
      # Tự động chạy script SQL khi khởi tạo lần đầu
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Mount thư mục CSV vào container để lệnh COPY đọc được
      - ./files:/data_files
    networks:
      - data-pipeline-network

  # 2. Zookeeper (Quản lý Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-pipeline-network

  # 3. Kafka (Message Broker)
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Cấu hình Listener: Internal (cho Debezium/Spark) & External (cho máy local của bạn)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-pipeline-network

  # 4. Debezium Connect (CDC - Capture Data Change)
  connect:
    image: debezium/connect:2.1
    container_name: debezium_connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      BOOTSTRAP_SERVERS: kafka:29092
      # Đường dẫn plugin nếu bạn cài thêm S3 sink hoặc JDBC sink
      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/connect/plugins
    volumes:
      # Nếu bạn có plugin custom, bỏ vào thư mục ./debezium/plugins
      - ./debezium/plugins:/kafka/connect/plugins
    networks:
      - data-pipeline-network

  # 5. MinIO (Data Lake Storage - Thay thế S3)
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - data-pipeline-network

  # 6. Spark Master (Xử lý dữ liệu)
  spark-master:
    image: apache/spark:3.4.0
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      # Cấu hình để Spark nói chuyện được với MinIO
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    networks:
      - data-pipeline-network

  # 7. Spark Worker
  spark-worker:
    image: apache/spark:3.4.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
    networks:
      - data-pipeline-network
  backend:
    build: ./backend
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "8888:8888"
    environment:
      - NODE_ENV=development
      - DATABASE=mongodb://mongo:27017/local-idurar-erp-crp
      - PORT=8888
      - NODE_OPTIONS=--openssl-legacy-provider
      - JWT_SECRET=secret_key_1234

    command: sh -c "npm run setup && npm run dev"

    networks:
      - server-mongo

    depends_on:
      - mongo

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://backend:8888/api
      - NODE_OPTIONS=--openssl-legacy-provider

    depends_on:
      - backend

  mongo:
    image: mongo
    volumes:
      - mongodb_data:/data/db
    networks:
      - server-mongo
:

networks:
  data-pipeline-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  mongodb_data:
